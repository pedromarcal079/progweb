<!DOCTYPE html>
<html>

<head>
    <title>ReceitaReact - 3</title>
</head>

<body>
    <div id="app">
    </div>
    <script src="libs/react.js"></script>
    <script src="libs/react-dom.js"></script>
    <script src="libs/babel.js"></script>
    <script type="text/babel">
        const TabelaBebidas = ({ titulo,cabecalhos,dadosTabela }) => {
            return (
                <div>
                    <h1>{titulo}</h1>
                    <table id="tabela" border="1">
                        <thead>
                            {cabecalhos.map((cabecalho, index) => (
                                <th key={index}>{cabecalho}</th>
                            ))}
                        </thead>
                        <tbody>
                            {dadosTabela.map((bebida, index) => (
                                <tr key={index}>
                                    <td>{bebida.nome}</td>
                                    <td>{bebida.marca}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )
        }

        const cabecalhos = ["Nome", "Marca"]
        const dadosTabela = [
            { nome: "Havana", marca: "Engenho Anísio Santiago" },
            { nome: "Coca-Cola", marca: "Coca-Cola Company" },
            { nome: "Pepsi", marca: "PepsiCo" },
            { nome: "Fanta", marca: "Coca-Cola Company" },
            { nome: "Sprite", marca: "Coca-Cola Company" }
        ]

        ReactDOM.render(
            <TabelaBebidas titulo="Minha tabela de bebidas" cabecalhos={cabecalhos} dadosTabela={dadosTabela}/>
            ,
            document.getElementById("app"))
    </script>
</body>

</html>
