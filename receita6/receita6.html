<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="receita6.css">
</head>

<body>
    <table>
        <tbody id="cervejasBody"></tbody>
    </table>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>
</body>

<script>
    let cervejas = [
        {
            name: "Guiness",
            alcohol: "10%",
            estilo: "Stout",
            ibu: "45"
        },
        {
            name: "Desperados",
            alcohol: "6%",
            estilo: "Lager",
            ibu: "25"
        },
        {
            name: "Becks",
            alcohol: "5%",
            estilo: "Pilsner",
            ibu: "30"
        }
    ]

    //cs é um array de cervejas
    const carregarDiv = (
        cs,
        id,
        headers = ["Nome", "Álcool", "Estilo", "Amargor"],
        props = ["name", "alcohol", "estilo", "ibu"]
    ) => {
        const elemento = document.getElementById(id)

        const cabecalhoHtml = `
        <thead>
            <tr>
                ${headers.map(header => `<th>${header}</th>`).join("")}
            </tr>
        </thead>`

        const itensHtml = cs.map(item => `
        <tr>
            ${props.map(prop => `<td>${item[prop] !== undefined ? item[prop] : ""}</td>`).join("")}
        </tr>`).join("\n")

        const corpoHtml = `<tbody>${itensHtml}</tbody>`
        elemento.innerHTML = `${cabecalhoHtml}\n${corpoHtml}`
    }

    let botao = document.getElementById("botaoCarregar")

    botao.addEventListener("click", () => carregarDiv(cervejas, "cervejasBody"))
</script>

</html>
